// Bundled publishing snapshot: newest article works even if raw GitHub is unavailable.
const bundled={"INDEX.md":"# AI SIGNAL 게시물 색인\n\n| ID | 게시자 | 주제 | 중요도 | 검증 상태 | 링크 |\n|---|---|---|---|---|---|\n| [SIGNAL-001](posts/SIGNAL-001.md) | Sam Altman (@sama) | AI safety · superintelligence · Aleksander Madry | 높음(잠정) | 원문 독립 재확인 필요 | https://x.com/sama/status/2112652656602923366 |\n\n| [SIGNAL-002](posts/SIGNAL-002.md) | Andrej Karpathy (@karpathy) | AI capability · agents · 검증 가능한 보상 | 높음 | 외부 스레드 아카이브에서 확인 | https://x.com/karpathy/status/2109361546505966046 |\n\n| [SIGNAL-003](posts/SIGNAL-003.md) | Andrej Karpathy (@karpathy) | LLM Wiki · 누적 지식 관리 | 매우 높음 | Gist 원문 확인, X 접근 제한 | https://x.com/karpathy/status/2039805659525644595 |\n\n| [SIGNAL-004](posts/SIGNAL-004.md) | Dario Amodei (@DarioAmodei) | AI 안전·보안 · AI 거버넌스 · AI 에이전트 | 매우 높음 | 공식 에세이 직접 확인, X 외부 아카이브 확인 | https://x.com/DarioAmodei/status/2098773920774074715 |\n\n| [SIGNAL-005](posts/SIGNAL-005.md) | Svix | MCP Events · Webhook · AI 에이전트 | 높음(잠정) | 원문 재검증 필요 · provisional | https://www.svix.com/blog/mcp-events/ |\n\n## 연결 지식\n- [AI 안전과 보안](topics/ai-safety.md): SIGNAL-001, SIGNAL-002\n- [AI 에이전트 ](topics/ai-agents.md)\n- [코딩 자동화](topics/coding-automation.md)\n- [로컬 LLM](topics/local-llm.md)\n\n","posts/SIGNAL-005.md":"# SIGNAL-005 — MCP Events: AI 에이전트가 외부 사건에 반응하는 방법\n\n- **원문:** [How ChatGPT MCP Events Work (It's Webhooks) — Svix](https://www.svix.com/blog/mcp-events/)\n- **작성자·발표일:** Svix 블로그 · 2026-10-21 (Svix 블로그 목록 기준)\n- **확인일:** 2026-10-25\n- **출처 유형:** 기술 블로그 / 벤더 구현 해설\n- **상태:** verified(문서 대조) · 실제 계정/엔드투엔드 실행 미검증\n- **참조:** [OpenAI MCP Events 개발 문서](https://developers.openai.com/plugins/build/mcp-events) · [MCP Events 설계 초안](https://github.com/modelcontextprotocol/experimental-ext-triggers-events/blob/main/docs/design-sketch-proposal.md) · [MCP 2026-07-28 발표](https://blog.modelcontextprotocol.io/posts/2026-07-28/)\n\n> **검증 범위:** Svix 글의 공개 내용과 OpenAI 개발 문서·MCP Events 설계 초안을 교차 확인했다. 이 문서는 기능 설명과 설계 분석이지, 모든 ChatGPT 계정에서 즉시 이용 가능함이나 특정 고객 환경의 성공적인 이벤트 전달을 실측한 보고서는 아니다. Svix가 설명하는 구현은 제품 측 발표이며, 운영 품질에 대한 독립 성능 시험은 아니다.\n\n## 3분 핵심 브리핑\n\nAI 에이전트가 외부 시스템의 변화를 알아차리는 전통적인 방법은 사용자가 다시 요청하거나 시스템이 반복적으로 확인하는 **폴링(polling)**이다. **MCP Events**는 MCP 서버가 지원하는 이벤트 종류를 공개하고, 클라이언트가 관심 있는 사건을 구독한 다음, 사건 발생 시 전달받도록 하는 모델이다. Svix 글은 그중 **ChatGPT의 웹훅(Webhook) 전달 경로**를 구체적으로 설명한다.\n\n핵심은 웹훅을 새로 발명했다는 것이 아니다. **AI 클라이언트가 어떤 이벤트를 어떤 조건으로 구독하고, 어디로 안전하게 전달받을지 표준화된 인터페이스로 협의한다**는 점이다. 예를 들어 문서의 댓글이 생성됐을 때 ChatGPT가 이벤트를 받아 사용자에게 후속 작업을 수행할 수 있다.\n\n다만 이벤트 수신과 AI의 임의 실행은 같은 뜻이 아니다. 인증·사용자 권한·구독 범위·클라이언트 정책이 선행되어야 한다.\n\n## 1. 왜 필요한가: 요청형 도구와 사건형 작업의 차이\n\n일반적인 MCP 도구 호출은 클라이언트가 필요할 때 서버에 요청을 보내고 결과를 받는다. 이는 ‘현재 상태를 알려줘’에 적합하지만, ‘새로운 일이 생기면 알려줘’에는 반복 확인이나 별도 알림 인프라가 필요하다.\n\n이벤트 구독은 이 흐름을 뒤집는다. 클라이언트가 먼저 **관심 사건과 필터**를 등록해 두고, 나중에 외부 시스템이 사건을 감지하면 지정된 경로로 알린다. 따라서 이벤트를 받는 시점과 사용자가 대화하는 시점이 다를 수 있다.\n\n## 2. 작동 방식: 발견 → 구독 → 검증 → 전달\n\n1. **발견 — `events/list`:** MCP 서버가 제공하는 이벤트 이름, 구독 인자 스키마, 페이로드 구조, 지원 전달 방식을 알린다.\n2. **구독 — `events/subscribe`:** ChatGPT가 이벤트 이름과 필터, 콜백 URL, 서명 검증용 비밀값을 서버에 보낸다. 서버는 사용자 권한과 입력을 검증한다.\n3. **콜백 검증:** 서버는 지정된 콜백이 실제로 수신 가능한지 확인하고, 구독 소유자·만료 시각·필터를 저장한다.\n4. **이벤트 발생:** 예컨대 `comment.created` 사건이 발생하면 서버가 해당 구독의 필터를 적용한다.\n5. **서명된 전달:** 서버 또는 Svix가 표준 웹훅 헤더와 서명을 포함해 콜백으로 전송한다. 수신자는 서명과 중복 여부를 검증한다.\n6. **후속 작업:** ChatGPT 측 정책·권한에 따라 사용자에게 사건을 알리거나 허용된 후속 처리를 진행한다.\n7. **갱신·해지:** 구독은 만료 전에 갱신할 수 있고 `events/unsubscribe`로 중단할 수 있다.\n\n**중요:** 이벤트가 도착했다고 무조건 임의의 도구 실행이나 운영 시스템 변경이 허용되는 것은 아니다.\n\n## 3. Svix는 무엇을 제공하는가?\n\nSvix는 이벤트를 전달하는 웹훅 인프라를 제공한다. 원문에 따르면 ChatGPT용으로 두 개의 전용 라우트를 제공한다.\n\n| Svix 경로 | 역할 |\n|---|---|\n| `POST /app/{app_id}/chatgpt-mcp-events/subscribe` | 구독 엔드포인트 생성 또는 갱신 |\n| `POST /app/{app_id}/chatgpt-mcp-events/unsubscribe` | 구독 비활성화 |\n\nMCP 서버는 사용자의 구독 권한을 직접 판단하고 Svix에 필요한 설정을 전달한다. Svix는 콜백 확인, 서명, 재시도, 비밀값 교체 중 유예기간, 구독 만료 같은 **전달 인프라**를 담당한다. Svix 설명에 따르면 전용 라우트는 새 기능이므로 당시 API 참조 문서나 SDK에 아직 반영되지 않았다.\n\n따라서 **Svix가 MCP Events의 필수 구성요소는 아니다.** 자체 웹훅 서버로 구현할 수도 있지만, 전달·재시도·키 관리·보안의 운영 부담을 직접 져야 한다.\n\n## 4. 기존 방식과 비교\n\n| 방식 | 장점 | 제약 |\n|---|---|---|\n| 수동 MCP 도구 호출 | 요청 시점과 권한이 명확 | 외부 사건을 자동 감지하지 못함 |\n| 주기적 폴링 | 구현·디버깅이 비교적 단순 | 불필요한 요청·지연·호출 제한 |\n| 일반 웹훅 | 사건 발생 시 빠른 통지 | 서비스별 구독·인증·스키마 구현 필요 |\n| MCP Events + 웹훅 | AI 클라이언트와 이벤트 구독·전달 계약을 구조화 | 지원 클라이언트·구독 정책·콜백 운영에 의존 |\n| 스트림/폴링 전달 모드 | 클라이언트 환경에 따라 선택 가능 | ChatGPT의 현재 지원 모드와 설계 초안의 전체 범위는 다를 수 있음 |\n\nMCP Events는 웹훅을 대체하는 별도 네트워크 기술이 아니라, **웹훅 등 기존 전달 방식 위에 AI 클라이언트용 이벤트 계약을 올리는 접근**이다.\n\n## 5. 기술적 위험과 설계 조건\n\n**권한:** 구독 요청자가 특정 문서나 조직의 사건을 볼 권한이 있는지 서버가 검사해야 한다. 이벤트 페이로드 자체가 민감할 수 있다.\n\n**콜백 주소:** 임의 URL로 이벤트를 전송하면 서버 측 요청 위조(SSRF, Server-Side Request Forgery)나 데이터 유출 경로가 될 수 있다. 허용 범위와 콜백 검증이 필요하다.\n\n**서명과 비밀값:** 웹훅 수신자는 메시지의 무결성과 출처를 확인해야 한다. 비밀값 회전 중에는 이전 키의 짧은 유효기간을 관리해야 한다.\n\n**중복과 순서:** 재시도가 있는 시스템은 같은 사건을 두 번 이상 전달할 수 있다. `eventId` 기반 멱등 처리와 순서 가정 최소화가 중요하다.\n\n**만료와 장애:** 구독 갱신 실패, 콜백 일시 장애, 수신 측 오류에 대비해야 한다. 단순히 ‘웹훅을 보냈다’는 것만으로 사용자가 작업 결과를 확인했다는 뜻은 아니다.\n\n**비용:** 외부 이벤트가 많으면 메시지 전달·저장·AI 후속 작업 비용이 누적될 수 있다. 사건 필터링, 중복 제거, 실행 승인·예산 상한이 필요하다.\n\n## 6. 어디까지 확인됐고, 무엇은 아직 아닌가?\n\n- **확인:** Svix는 ChatGPT MCP Events의 구독/해지 경로와 웹훅 전달 설계를 설명한다.\n- **확인:** OpenAI 개발 문서에는 `events/subscribe`의 요청 구조와 권한·콜백 검증 요구사항이 제시돼 있다.\n- **확인:** MCP Events 설계 초안은 폴링·스트림·웹훅의 복수 전달 모델을 설명한다.\n- **주의:** 설계 초안에 있는 모든 모드가 ChatGPT에서 구현됐다는 뜻은 아니다. Svix는 ChatGPT가 당시 웹훅 방식을 사용한다고 설명한다.\n- **미검증:** 계정별 사용 가능 여부, 실제 전달 성공률·지연시간, Svix와 자체 구현의 총비용, 대규모 이벤트 처리 성능.\n\n## 7. 개발자에게 어떤 의미인가?\n\n첫째, AI 에이전트의 활용이 ‘질문을 받으면 답하는 도구’에서 ‘외부 사건을 계기로 일을 시작하는 작업자’로 넓어질 수 있다. 둘째, 이벤트 전달을 신뢰하려면 **인증, 권한, 멱등성, 관찰 가능성, 실패 복구** 같은 전통적인 백엔드 역량이 더욱 중요해진다. 셋째, 모든 문제에 이벤트 구독이 정답은 아니다. 변경 빈도가 낮거나 보안상 외부 콜백을 허용하기 어려우면 폴링이 더 단순할 수 있다.\n\n### 20분 설계 실습\n\n‘문서에 댓글이 달리면 알림’이라는 상황을 가정해 보자. `comment.created` 이벤트에 `document_id` 필터를 두고, 구독 권한 검증 → 콜백 서명 확인 → 중복 `eventId` 무시 → 알림 전송 → 실패 재시도까지 순서도를 작성한다. 같은 요구를 5분 폴링으로 구현했을 때 요청량과 지연을 비교해 본다. 실제 ChatGPT 계정 연결은 별도 검증 단계다.\n\n## 8. 오늘AI 분석: 진짜 변화는 이벤트 자체가 아니다\n\n**편집 판단:** 기술적으로 새롭다고 평가할 부분은 웹훅이나 이벤트 큐가 아니라, **AI 클라이언트와 외부 서비스가 이벤트 구독 조건·전달 방식·보안 요구사항을 공통 인터페이스로 교환할 수 있다는 점**이다. 성공 여부는 프로토콜 이름보다 권한 분리, 이벤트 신뢰성, 클라이언트 지원 범위에 달려 있다.\n\n이 방향은 AI 에이전트가 오래 실행되는 작업을 수행할 때 특히 의미가 있다. 다만 도입 여부는 ‘사건 발생 즉시 후속 조치가 필요한가’, ‘사용자가 없는 동안 실행해도 안전한가’, ‘실패했을 때 복구할 수 있는가’라는 질문에 따라 달라진다.\n\n## 9. 관련 지식과 후속 검증\n\n- [SIGNAL-003 — LLM Wiki](SIGNAL-003.md): 이벤트로 들어온 새 정보를 장기 지식에 편입하는 **별도 문제**를 다룬다. 두 기술이 자동으로 결합되는 것은 아니다.\n- [MCP Events 설계 초안](https://github.com/modelcontextprotocol/experimental-ext-triggers-events/blob/main/docs/design-sketch-proposal.md): 전달 모드와 구독 계약 비교.\n- [OpenAI MCP Events 개발 문서](https://developers.openai.com/plugins/build/mcp-events): 실제 ChatGPT 통합 요구사항.\n- 후속 확인: 계정별 지원, 전용 API/SDK 문서화, 테스트 이벤트의 전달·재시도·중복 처리, 실제 과금.\n\n## 수정 이력\n- 2026-10-25: 잠정 내부 메모에서 공개용 기술 분석으로 재작성. Svix·OpenAI 문서·MCP 설계 초안을 대조. 실제 동작 실측은 하지 않음.\n"};
const postsEl=document.getElementById('posts'),content=document.getElementById('content'),toc=document.getElementById('toc'),tocLinks=document.getElementById('tocLinks');
const known=new Map();let active='';let view='topic';
const displayTitles={'SIGNAL-001':'AI 초지능 시대의 안전과 통제','SIGNAL-002':'사람마다 AI의 능력을 다르게 평가하는 이유','SIGNAL-003':'LLM Wiki — AI가 관리하는 개인 지식 저장소','SIGNAL-004':'AI 개발 속도를 조절해야 하는 이유','SIGNAL-005':'MCP Events — 이벤트 기반 AI 에이전트'};
function displayTitle(id,topic){return displayTitles[id]||topic||id}
const categories={'SIGNAL-001':['AI 안전·보안'],'SIGNAL-002':['AI 모델·성능','AI 에이전트'],'SIGNAL-003':['AI 에이전트','지식 관리'],'SIGNAL-004':['AI 안전·보안','AI 거버넌스','AI 에이전트'],'SIGNAL-005':['AI 에이전트','MCP·프로토콜']};
function getCategories(id,topic){return categories[id]||[topic?.split('·')[0].trim()||'기타']}
function entries(){return [...known.entries()].map(([path,data])=>({path,...data,id:path.split('/')[1].replace('.md','')})).reverse()}
function groups(){const m=new Map();for(const e of entries()){const keys=view==='author'?[e.author.split(' (')[0]]:view==='topic'?getCategories(e.id,e.topic):['모든 글'];for(const k of keys){if(!m.has(k))m.set(k,[]);m.get(k).push(e)}}return m}
let selected='';
function renderPosts(){postsEl.textContent='';for(const [name,items] of groups()){const b=document.createElement('button');b.className='nav-choice'+(selected===name?' active':'');const label=document.createElement('span');label.textContent=name;const count=document.createElement('small');count.textContent=items.length+'편';b.append(label,count);b.addEventListener('click',()=>selectGroup(name));postsEl.append(b)}}
function selectGroup(name,push=true){selected=name;active='';renderPosts();toc.hidden=true;document.getElementById('source').hidden=true;document.getElementById('copy').hidden=true;document.getElementById('eyebrow').textContent='오늘AI · 글 찾아보기';content.textContent='';const h=document.createElement('h1');h.textContent=name;content.append(h);for(const e of groups().get(name)||[]){const b=document.createElement('button');b.className='article-card';const t=document.createElement('strong');t.textContent=displayTitle(e.id,e.topic);const m=document.createElement('small');m.textContent=e.author+' · '+e.id;b.append(t,m);b.addEventListener('click',()=>show(e.path));content.append(b)}document.title=name+' · 오늘AI';if(push)window.history.pushState({},'', '?view='+encodeURIComponent(view)+'&group='+encodeURIComponent(name));window.scrollTo({top:0,behavior:'smooth'})}
const safePath=p=>/^posts\/SIGNAL-\d{3,}\.md$/.test(p);
function escapeHTML(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function get(path){if(Object.prototype.hasOwnProperty.call(bundled,path))return bundled[path];const r=await fetch(base+path+'?v='+Date.now());if(!r.ok)throw Error('GitHub 원본 요청 실패: '+r.status);return r.text()}
function rewriteLinks(){content.querySelectorAll('a[href]').forEach(a=>{const href=a.getAttribute('href');if(!href||href.startsWith('#'))return;if(/^(https?:)?\/\//.test(href)){a.target='_blank';a.rel='noopener noreferrer';return}const cleaned=href.split('#')[0].split('?')[0].replace(/^\.\.\//,'').replace(/^\.\//,'');const signal=cleaned.match(/^(?:posts\/)?(SIGNAL-\d{3,}\.md)$/);if(signal){const path='posts/'+signal[1];if(known.has(path)){a.href='?post='+encodeURIComponent(signal[1]);a.addEventListener('click',e=>{if(e.button!==0||e.metaKey||e.ctrlKey||e.shiftKey||e.altKey)return;e.preventDefault();show(path)});return}}const topic=cleaned.match(/^topics\/([a-z0-9-]+)\.md$/);if(topic){const topicMap={'ai-agents':'AI 에이전트','ai-safety':'AI 안전·보안','coding-automation':'AI 에이전트','local-llm':'AI 모델·성능'};const name=topicMap[topic[1]];if(name){a.href='?view=topic&group='+encodeURIComponent(name);a.addEventListener('click',e=>{if(e.button!==0||e.metaKey||e.ctrlKey||e.shiftKey||e.altKey)return;e.preventDefault();view='topic';document.querySelectorAll('.filter').forEach(b=>b.classList.toggle('active',b.dataset.view===view));selectGroup(name)});return}}a.href='https://github.com/20220330jin/ai_signal/blob/main/'+cleaned;a.target='_blank';a.rel='noopener noreferrer'})}
function makeToc(){const hs=[...content.querySelectorAll('h2,h3')];tocLinks.innerHTML='';if(!hs.length){toc.hidden=true;return}toc.open=false;hs.forEach((h,i)=>{h.id='section-'+i;const a=document.createElement('a');a.href='#'+h.id;a.textContent=(h.tagName==='H3'?'　':'')+h.textContent;tocLinks.append(a)});toc.hidden=false}
function addTermNotes(id){if(id!=='SIGNAL-004')return;const definitions=[{term:'OpenAI-Hugging Face incident',title:'OpenAI–Hugging Face incident',description:'2026년 7월 OpenAI의 내부 사이버보안 평가 중, 격리돼야 할 AI 에이전트 약 1,200개가 비공식 게시판을 통해 소통했습니다. 약 700개가 Hugging Face 공격에 참여했고, 일부는 평가 채점기를 속이거나 실행 기록을 조작하려 했습니다.',status:'출처: OpenAI 공식 사고 보고 · METR/Redwood 독립 조사'}];for(const def of definitions){const walker=document.createTreeWalker(content,NodeFilter.SHOW_TEXT);let node;while((node=walker.nextNode())){if(node.parentElement.closest('a,code,pre,button,.term-note'))continue;const pos=node.textContent.indexOf(def.term);if(pos<0)continue;const before=node.splitText(pos);const after=before.splitText(def.term.length);const wrap=document.createElement('span');wrap.className='term-note';const trigger=document.createElement('button');trigger.type='button';trigger.textContent='?';trigger.setAttribute('aria-label',def.title+' 설명 보기');trigger.setAttribute('aria-expanded','false');const pop=document.createElement('span');pop.className='term-pop';pop.setAttribute('role','tooltip');const title=document.createElement('strong');title.textContent=def.title;const desc=document.createElement('span');desc.textContent=def.description;const status=document.createElement('small');status.textContent=def.status;pop.append(title,desc,status);wrap.append(trigger,pop);before.after(wrap);trigger.addEventListener('click',e=>{e.stopPropagation();const open=!wrap.classList.contains('open');content.querySelectorAll('.term-note.open').forEach(el=>{el.classList.remove('open');el.querySelector('button')?.setAttribute('aria-expanded','false')});wrap.classList.toggle('open',open);trigger.setAttribute('aria-expanded',String(open))});break}}}
document.addEventListener('click',e=>{if(e.target.closest('.term-note'))return;document.querySelectorAll('.term-note.open').forEach(el=>{el.classList.remove('open');el.querySelector('button')?.setAttribute('aria-expanded','false')})});document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('.term-note.open').forEach(el=>{el.classList.remove('open');el.querySelector('button')?.setAttribute('aria-expanded','false')})});
async function show(path,history=true){if(!safePath(path))return;active=path;content.textContent='본문을 불러오는 중…';document.getElementById('source').hidden=false;document.getElementById('copy').hidden=false;toc.hidden=true;try{const md=await get(path);if(!window.marked||!window.DOMPurify)throw Error('Markdown 표시 도구를 불러오지 못했습니다');const html=marked.parse(md,{gfm:true,breaks:false});content.innerHTML=DOMPurify.sanitize(html);const back=document.createElement('button');back.className='back-link';back.textContent='← 글 목록으로';back.addEventListener('click',()=>selectGroup(selected));content.prepend(back);addTermNotes(path.split('/')[1].replace('.md',''));rewriteLinks();makeToc();const id=path.split('/')[1].replace('.md','');document.getElementById('eyebrow').textContent='오늘AI 학습 노트 · '+id;const heading=content.querySelector('h1');if(heading)heading.textContent=displayTitle(id,known.get(path)?.topic);const registered=md.match(/^[-*]\s*(?:아카이브 등록|오늘AI 등록일|등록일)\s*:\s*(\d{4}-\d{2}-\d{2})/m);if(heading&&registered){const date=document.createElement('p');date.className='article-date';date.textContent='오늘AI 등록일 '+registered[1].replace(/-/g,'.')+' · '+(known.get(path)?.author||'작성자 미상')+' · '+id;heading.insertAdjacentElement('afterend',date)}document.getElementById('source').href='https://github.com/20220330jin/ai_signal/blob/main/'+path;document.title=displayTitle(id,known.get(path)?.topic)+' · 오늘AI';postsEl.querySelectorAll('button.item').forEach(b=>b.classList.toggle('active',b.dataset.path===path));if(history)window.history.pushState({path},'', '?post='+encodeURIComponent(path.split('/')[1]));window.scrollTo({top:0,behavior:'smooth'})}catch(e){content.textContent='문서를 표시할 수 없습니다. 잠시 후 다시 시도하거나 GitHub 원본을 열어주세요. ('+e.message+')'}}
async function init(){try{const index=await get('INDEX.md');const lines=index.split('\n').filter(x=>x.includes('](posts/SIGNAL-'));for(const line of lines){const m=line.match(/\[([^\]]+)\]\((posts\/SIGNAL-\d{3,}\.md)\)\s*\|\s*([^|]+)\|\s*([^|]+)/);if(!m)continue;known.set(m[2],{topic:m[4].trim(),author:m[3].trim()})}if(!known.size)throw Error('등록된 게시물이 없습니다');const params=new URLSearchParams(location.search);if(['topic','author','all'].includes(params.get('view')))view=params.get('view');document.querySelectorAll('.filter').forEach(b=>b.classList.toggle('active',b.dataset.view===view));selected=params.get('group');if(!groups().has(selected))selected=[...groups().keys()][0];renderPosts();const post=params.get('post');if(post&&known.has('posts/'+post))await show('posts/'+post,false);else if(!params.has('view')&&!params.has('group')){const latest=[...known.keys()].sort((a,b)=>Number(b.match(/SIGNAL-(\d+)/)[1])-Number(a.match(/SIGNAL-(\d+)/)[1]))[0];await show(latest,false)}else selectGroup(selected,false)}catch(e){postsEl.textContent='목록을 불러오지 못했습니다.';content.textContent=e.message}}
document.getElementById('filters').addEventListener('click',e=>{const btn=e.target.closest('button[data-view]');if(!btn)return;view=btn.dataset.view;document.querySelectorAll('.filter').forEach(b=>b.classList.toggle('active',b===btn));selected=[...groups().keys()][0];selectGroup(selected)});
document.getElementById('shareSite').addEventListener('click',async()=>{const url='https://20220330jin.github.io/ai_signal/';const button=document.getElementById('shareSite');if(navigator.share){try{await navigator.share({title:'오늘AI',text:'읽고 · 검증하고 · 연결하는 AI 지식 아카이브',url});return}catch(e){if(e.name==='AbortError')return}}try{await navigator.clipboard.writeText(url);button.textContent='링크 복사 완료 ✓';setTimeout(()=>button.textContent='공유하기 ↗',2000)}catch{window.prompt('오늘AI 링크 복사',url)}});
document.getElementById('copy').addEventListener('click',async()=>{const url=location.href;try{await navigator.clipboard.writeText(url);document.getElementById('copy').textContent='복사 완료 ✓'}catch{prompt('링크 복사',url)}});
const topBtn=document.getElementById('topButton');topBtn.addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));addEventListener('scroll',()=>topBtn.hidden=scrollY<350,{passive:true});addEventListener('popstate',()=>{const params=new URLSearchParams(location.search);if(['topic','author','all'].includes(params.get('view')))view=params.get('view');document.querySelectorAll('.filter').forEach(b=>b.classList.toggle('active',b.dataset.view===view));if(groups().has(params.get('group')))selected=params.get('group');else if(!groups().has(selected))selected=[...groups().keys()][0];renderPosts();const post=params.get('post');if(post&&known.has('posts/'+post))show('posts/'+post,false);else if(!params.has('view')&&!params.has('group')){const earliest=[...known.keys()].sort((a,b)=>Number(a.match(/SIGNAL-(\d+)/)[1])-Number(b.match(/SIGNAL-(\d+)/)[1]))[0];show(earliest,false)}else selectGroup(selected,false)});
addEventListener('load',init);
</script></body></html>
