<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101828"><meta name="description" content="오늘AI — 함께 배우는 AI 인사이트">
<title>오늘AI · AI 학습 아카이브</title>
<style>
:root{color-scheme:light;--ink:#182334;--muted:#64748b;--line:#e4e9f0;--blue:#2958d6;--bg:#f5f7fb}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.75 system-ui,-apple-system,"Noto Sans KR",sans-serif}button,a{touch-action:manipulation}a{color:var(--blue)}header{background:#101828;color:#fff;padding:20px max(20px,calc((100vw - 1060px)/2));display:flex;justify-content:space-between;align-items:center;gap:10px}header strong{letter-spacing:.14em;font-size:20px}header span{color:#aab9d0;font-size:12px}.site-version{font-size:11px;color:#8294b2;margin-top:3px;letter-spacing:.02em}header a{color:#d7e5ff;text-decoration:none;font-size:13px}.header-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}.share-site{border:1px solid #647895;background:#243a5b;color:#fff;border-radius:9px;padding:8px 12px;cursor:pointer;font:inherit;font-size:13px}.share-site:hover{background:#31517c}.shell{max-width:1320px;margin:auto;padding:24px 20px;display:grid;grid-template-columns:350px minmax(0,1fr);gap:24px}.panel,.article{background:white;border:1px solid var(--line);border-radius:16px;box-shadow:0 6px 25px #15244108}.panel{padding:22px;align-self:start;position:sticky;top:15px;max-height:calc(100vh - 30px);overflow:auto}.panel h2{font-size:14px;letter-spacing:.05em;margin:0 0 14px}.filters{display:flex;gap:5px;margin-bottom:12px;flex-wrap:wrap}.filter{border:1px solid var(--line);border-radius:20px;padding:6px 10px;background:white;cursor:pointer;font-size:12px;color:var(--ink)}.filter.active{background:#1f4dd1;color:white;border-color:#1f4dd1}.nav-choice{display:flex;justify-content:space-between;width:100%;padding:13px;border:1px solid transparent;border-radius:10px;background:white;cursor:pointer;text-align:left;color:var(--ink);font:inherit;font-size:14px}.nav-choice.active,.nav-choice:hover{background:#edf3ff;border-color:#dce6ff}.nav-choice small{color:var(--muted)}.article-card{display:block;width:100%;text-align:left;padding:18px;margin:12px 0;border:1px solid var(--line);border-radius:12px;background:white;cursor:pointer;color:var(--ink);font:inherit}.article-card:hover{background:#f5f8ff}.article-card strong{display:block;font-size:19px}.article-card small{color:var(--muted)}.back-link{border:0;background:none;color:var(--blue);cursor:pointer;padding:8px 0;font:inherit}.group-title{font-size:12px;color:var(--muted);font-weight:700;margin:16px 8px 6px}.item{display:block;text-align:left;width:100%;border:1px solid transparent;background:none;padding:12px 14px;border-radius:10px;cursor:pointer;color:var(--ink);font:inherit;font-size:14px;line-height:1.5;overflow-wrap:break-word}.item strong{font-size:14px;letter-spacing:-.02em}.item small{font-size:12px}.item small{display:block;color:var(--muted);margin-top:4px}.item:hover,.item.active{background:#edf3ff;border-color:#dce6ff}.article{padding:clamp(22px,5vw,52px);min-height:65vh}.eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--blue)}.article-date{color:var(--muted);font-size:13px;margin:-6px 0 16px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}.article h1{font-size:clamp(26px,4vw,38px);line-height:1.35;margin:10px 0 20px;letter-spacing:-.03em}.article h2{font-size:24px;line-height:1.4;border-top:1px solid var(--line);padding-top:30px;margin-top:36px}.article h3{font-size:19px;margin-top:26px}.article p,.article li{overflow-wrap:anywhere}.article blockquote{border-left:4px solid #b6c9f5;background:#f7faff;margin:18px 0;padding:6px 20px}.article pre{overflow:auto;background:#152134;color:white;padding:16px;border-radius:10px}.article code{font-size:.88em}.article table{border-collapse:collapse;display:block;overflow-x:auto;font-size:14px}.article th,.article td{padding:10px 12px;border:1px solid var(--line);text-align:left}.article img{max-width:100%}.toc{padding:12px 16px;border-radius:12px;background:#f5f8ff;border:1px solid #e2eaff;margin:14px 0}.toc summary{cursor:pointer;font-weight:700;list-style-position:inside}.toc[open]{padding-bottom:16px}.toc strong{display:block;margin-bottom:7px}.toc a{display:block;font-size:14px;padding:4px 0;text-decoration:none}.meta{color:var(--muted);font-size:13px}.tools{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0 22px}.tools a,.tools button{border:1px solid var(--line);border-radius:9px;padding:8px 13px;background:#fff;color:#334155;text-decoration:none;cursor:pointer;font-size:13px}.top{position:fixed;right:20px;bottom:24px;border:0;background:#1f4dd1;color:#fff;border-radius:99px;padding:13px 17px;box-shadow:0 5px 20px #1f4dd144;cursor:pointer;font-weight:700;z-index:10}.top[hidden]{display:none}.status{color:var(--muted)}@media(max-width:760px){header{padding:16px 18px}.shell{display:block;padding:12px}.panel{position:static;max-height:none;margin-bottom:12px;padding:14px}.panel nav{display:flex;overflow-x:auto;gap:8px}.item{min-width:190px;max-width:230px;border-color:var(--line);font-size:14px}.article{padding:24px 18px}.article h2{font-size:21px}.top{right:14px;bottom:16px}}
.term-note{display:inline-block;position:relative;vertical-align:super;margin-left:3px;line-height:1}.term-note>button{border:1px solid #b8c8e8;border-radius:50%;background:#edf3ff;color:#2958d6;width:19px;height:19px;font-size:12px;font-weight:700;line-height:17px;padding:0;cursor:help}.term-note>button:focus-visible{outline:2px solid #2958d6;outline-offset:2px}.term-pop{display:none;position:absolute;z-index:30;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);width:min(300px,calc(100vw - 36px));padding:12px 14px;border:1px solid #c8d6ed;border-radius:10px;background:#fff;color:#182334;box-shadow:0 10px 28px #10182825;font-size:13px;font-weight:400;line-height:1.55;text-align:left;white-space:normal}.term-note:hover .term-pop,.term-note:focus-within .term-pop,.term-note.open .term-pop{display:block}.term-pop strong{display:block;margin-bottom:5px}.term-pop small{display:block;margin-top:7px;color:#64748b;font-size:11px}@media(max-width:650px){.term-pop{left:auto;right:-8px;transform:none}}
</style>
<script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js" defer></script>
</head><body id="top"><header><div><strong>오늘AI</strong><div><span>읽고 · 검증하고 · 연결하는 AI 지식 아카이브</span></div><div class="site-version">사이트 v1.3.0 · UI/운영 체계 버전</div></div><div class="header-actions"><button class="share-site" id="shareSite" type="button">공유하기 ↗</button><a href="https://github.com/20220330jin/ai_signal" target="_blank" rel="noopener noreferrer">GitHub ↗</a></div></header>
<main class="shell"><aside class="panel"><h2>글 찾아보기</h2><div class="filters" id="filters"><button type="button" class="filter active" data-view="topic">주제별</button><button type="button" class="filter" data-view="author">작성자별</button><button type="button" class="filter" data-view="all">전체</button></div><nav id="posts"><span class="status">목록을 불러오는 중…</span></nav><p class="meta">주제나 작성자를 선택해 관심 있는 글부터 읽어보세요.</p></aside><section class="article"><div class="eyebrow" id="eyebrow">오늘AI · 학습 아카이브</div><div class="tools"><a id="source" href="https://github.com/20220330jin/ai_signal" target="_blank" rel="noopener noreferrer">GitHub 원본 ↗</a><button id="copy" type="button">현재 글 링크 복사</button></div><details id="toc" class="toc" hidden><summary>이 글의 목차 · 눌러서 펼치기</summary><div id="tocLinks"></div></details><div id="content" class="status" aria-live="polite">분석을 불러오는 중…</div></section></main><button class="top" id="topButton" type="button" hidden aria-label="페이지 맨 위로 이동">↑ 맨 위로</button>
<script>
const base='https://raw.githubusercontent.com/20220330jin/ai_signal/main/';
const postsEl=document.getElementById('posts'),content=document.getElementById('content'),toc=document.getElementById('toc'),tocLinks=document.getElementById('tocLinks');
const known=new Map();let active='';let view='topic';
const displayTitles={'SIGNAL-001':'AI 초지능 시대의 안전과 통제','SIGNAL-002':'사람마다 AI의 능력을 다르게 평가하는 이유','SIGNAL-003':'LLM Wiki — AI가 관리하는 개인 지식 저장소','SIGNAL-004':'AI 개발 속도를 조절해야 하는 이유'};
function displayTitle(id,topic){return displayTitles[id]||topic||id}
const categories={'SIGNAL-001':['AI 안전·보안'],'SIGNAL-002':['AI 모델·성능','AI 에이전트'],'SIGNAL-003':['AI 에이전트','지식 관리'],'SIGNAL-004':['AI 안전·보안','AI 거버넌스','AI 에이전트']};
function getCategories(id,topic){return categories[id]||[topic?.split('·')[0].trim()||'기타']}
function entries(){return [...known.entries()].map(([path,data])=>({path,...data,id:path.split('/')[1].replace('.md','')})).reverse()}
function groups(){const m=new Map();for(const e of entries()){const keys=view==='author'?[e.author.split(' (')[0]]:view==='topic'?getCategories(e.id,e.topic):['모든 글'];for(const k of keys){if(!m.has(k))m.set(k,[]);m.get(k).push(e)}}return m}
let selected='';
function renderPosts(){postsEl.textContent='';for(const [name,items] of groups()){const b=document.createElement('button');b.className='nav-choice'+(selected===name?' active':'');const label=document.createElement('span');label.textContent=name;const count=document.createElement('small');count.textContent=items.length+'편';b.append(label,count);b.addEventListener('click',()=>selectGroup(name));postsEl.append(b)}}
function selectGroup(name,push=true){selected=name;active='';renderPosts();toc.hidden=true;document.getElementById('source').hidden=true;document.getElementById('copy').hidden=true;document.getElementById('eyebrow').textContent='오늘AI · 글 찾아보기';content.textContent='';const h=document.createElement('h1');h.textContent=name;content.append(h);for(const e of groups().get(name)||[]){const b=document.createElement('button');b.className='article-card';const t=document.createElement('strong');t.textContent=displayTitle(e.id,e.topic);const m=document.createElement('small');m.textContent=e.author+' · '+e.id;b.append(t,m);b.addEventListener('click',()=>show(e.path));content.append(b)}document.title=name+' · 오늘AI';if(push)window.history.pushState({},'', '?view='+encodeURIComponent(view)+'&group='+encodeURIComponent(name));window.scrollTo({top:0,behavior:'smooth'})}
const safePath=p=>/^posts\/SIGNAL-\d{3,}\.md$/.test(p);
function escapeHTML(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function get(path){const r=await fetch(base+path+'?v='+Math.floor(Date.now()/300000));if(!r.ok)throw Error('GitHub 원본 요청 실패: '+r.status);return r.text()}
function rewriteLinks(){content.querySelectorAll('a[href]').forEach(a=>{const href=a.getAttribute('href');if(!href||href.startsWith('#'))return;if(/^(https?:)?\/\//.test(href)){a.target='_blank';a.rel='noopener noreferrer';return}const cleaned=href.split('#')[0].split('?')[0].replace(/^\.\.\//,'').replace(/^\.\//,'');const signal=cleaned.match(/^(?:posts\/)?(SIGNAL-\d{3,}\.md)$/);if(signal){const path='posts/'+signal[1];if(known.has(path)){a.href='?post='+encodeURIComponent(signal[1]);a.addEventListener('click',e=>{if(e.button!==0||e.metaKey||e.ctrlKey||e.shiftKey||e.altKey)return;e.preventDefault();show(path)});return}}const topic=cleaned.match(/^topics\/([a-z0-9-]+)\.md$/);if(topic){const topicMap={'ai-agents':'AI 에이전트','ai-safety':'AI 안전·보안','coding-automation':'AI 에이전트','local-llm':'AI 모델·성능'};const name=topicMap[topic[1]];if(name){a.href='?view=topic&group='+encodeURIComponent(name);a.addEventListener('click',e=>{if(e.button!==0||e.metaKey||e.ctrlKey||e.shiftKey||e.altKey)return;e.preventDefault();view='topic';document.querySelectorAll('.filter').forEach(b=>b.classList.toggle('active',b.dataset.view===view));selectGroup(name)});return}}a.href='https://github.com/20220330jin/ai_signal/blob/main/'+cleaned;a.target='_blank';a.rel='noopener noreferrer'})}
function makeToc(){const hs=[...content.querySelectorAll('h2,h3')];tocLinks.innerHTML='';if(!hs.length){toc.hidden=true;return}toc.open=false;hs.forEach((h,i)=>{h.id='section-'+i;const a=document.createElement('a');a.href='#'+h.id;a.textContent=(h.tagName==='H3'?'　':'')+h.textContent;tocLinks.append(a)});toc.hidden=false}
function addTermNotes(id){if(id!=='SIGNAL-004')return;const definitions=[{term:'OpenAI-Hugging Face incident',title:'OpenAI–Hugging Face incident',description:'아모데이가 AI 에이전트의 예상 밖 행동을 설명하기 위해 언급한 사례입니다. 사건의 상세 사실관계는 오늘AI에서 독립적으로 검증하지 않았습니다.',status:'사실관계 독립 검증 전'}];for(const def of definitions){const walker=document.createTreeWalker(content,NodeFilter.SHOW_TEXT);let node;while((node=walker.nextNode())){if(node.parentElement.closest('a,code,pre,button,.term-note'))continue;const pos=node.textContent.indexOf(def.term);if(pos<0)continue;const before=node.splitText(pos);const after=before.splitText(def.term.length);const wrap=document.createElement('span');wrap.className='term-note';const trigger=document.createElement('button');trigger.type='button';trigger.textContent='ⓘ';trigger.setAttribute('aria-label',def.title+' 설명 보기');trigger.setAttribute('aria-expanded','false');const pop=document.createElement('span');pop.className='term-pop';pop.setAttribute('role','tooltip');const title=document.createElement('strong');title.textContent=def.title;const desc=document.createElement('span');desc.textContent=def.description;const status=document.createElement('small');status.textContent=def.status;pop.append(title,desc,status);wrap.append(trigger,pop);before.after(wrap);trigger.addEventListener('click',e=>{e.stopPropagation();const open=!wrap.classList.contains('open');content.querySelectorAll('.term-note.open').forEach(el=>{el.classList.remove('open');el.querySelector('button')?.setAttribute('aria-expanded','false')});wrap.classList.toggle('open',open);trigger.setAttribute('aria-expanded',String(open))});break}}}
document.addEventListener('click',e=>{if(e.target.closest('.term-note'))return;document.querySelectorAll('.term-note.open').forEach(el=>{el.classList.remove('open');el.querySelector('button')?.setAttribute('aria-expanded','false')})});document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('.term-note.open').forEach(el=>{el.classList.remove('open');el.querySelector('button')?.setAttribute('aria-expanded','false')})});
async function show(path,history=true){if(!safePath(path))return;active=path;content.textContent='본문을 불러오는 중…';document.getElementById('source').hidden=false;document.getElementById('copy').hidden=false;toc.hidden=true;try{const md=await get(path);if(!window.marked||!window.DOMPurify)throw Error('Markdown 표시 도구를 불러오지 못했습니다');const html=marked.parse(md,{gfm:true,breaks:false});content.innerHTML=DOMPurify.sanitize(html);const back=document.createElement('button');back.className='back-link';back.textContent='← 글 목록으로';back.addEventListener('click',()=>selectGroup(selected));content.prepend(back);addTermNotes(path.split('/')[1].replace('.md',''));rewriteLinks();makeToc();const id=path.split('/')[1].replace('.md','');document.getElementById('eyebrow').textContent='오늘AI 학습 노트 · '+id;const heading=content.querySelector('h1');if(heading)heading.textContent=displayTitle(id,known.get(path)?.topic);const registered=md.match(/^[-*]\s*(?:아카이브 등록|오늘AI 등록일|등록일)\s*:\s*(\d{4}-\d{2}-\d{2})/m);if(heading&&registered){const date=document.createElement('p');date.className='article-date';date.textContent='오늘AI 등록일 '+registered[1].replace(/-/g,'.')+' · '+(known.get(path)?.author||'작성자 미상')+' · '+id;heading.insertAdjacentElement('afterend',date)}document.getElementById('source').href='https://github.com/20220330jin/ai_signal/blob/main/'+path;document.title=displayTitle(id,known.get(path)?.topic)+' · 오늘AI';postsEl.querySelectorAll('button.item').forEach(b=>b.classList.toggle('active',b.dataset.path===path));if(history)window.history.pushState({path},'', '?post='+encodeURIComponent(path.split('/')[1]));window.scrollTo({top:0,behavior:'smooth'})}catch(e){content.textContent='문서를 표시할 수 없습니다. 잠시 후 다시 시도하거나 GitHub 원본을 열어주세요. ('+e.message+')'}}
async function init(){try{const index=await get('INDEX.md');const lines=index.split('\n').filter(x=>x.includes('](posts/SIGNAL-'));for(const line of lines){const m=line.match(/\[([^\]]+)\]\((posts\/SIGNAL-\d{3,}\.md)\)\s*\|\s*([^|]+)\|\s*([^|]+)/);if(!m)continue;known.set(m[2],{topic:m[4].trim(),author:m[3].trim()})}if(!known.size)throw Error('등록된 게시물이 없습니다');const params=new URLSearchParams(location.search);if(['topic','author','all'].includes(params.get('view')))view=params.get('view');document.querySelectorAll('.filter').forEach(b=>b.classList.toggle('active',b.dataset.view===view));selected=params.get('group');if(!groups().has(selected))selected=[...groups().keys()][0];renderPosts();const post=params.get('post');if(post&&known.has('posts/'+post))await show('posts/'+post,false);else selectGroup(selected,false)}catch(e){postsEl.textContent='목록을 불러오지 못했습니다.';content.textContent=e.message}}
document.getElementById('filters').addEventListener('click',e=>{const btn=e.target.closest('button[data-view]');if(!btn)return;view=btn.dataset.view;document.querySelectorAll('.filter').forEach(b=>b.classList.toggle('active',b===btn));selected=[...groups().keys()][0];selectGroup(selected)});
document.getElementById('shareSite').addEventListener('click',async()=>{const url='https://20220330jin.github.io/ai_signal/';const button=document.getElementById('shareSite');if(navigator.share){try{await navigator.share({title:'오늘AI',text:'읽고 · 검증하고 · 연결하는 AI 지식 아카이브',url});return}catch(e){if(e.name==='AbortError')return}}try{await navigator.clipboard.writeText(url);button.textContent='링크 복사 완료 ✓';setTimeout(()=>button.textContent='공유하기 ↗',2000)}catch{window.prompt('오늘AI 링크 복사',url)}});
document.getElementById('copy').addEventListener('click',async()=>{const url=location.href;try{await navigator.clipboard.writeText(url);document.getElementById('copy').textContent='복사 완료 ✓'}catch{prompt('링크 복사',url)}});
const topBtn=document.getElementById('topButton');topBtn.addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));addEventListener('scroll',()=>topBtn.hidden=scrollY<350,{passive:true});addEventListener('popstate',()=>{const params=new URLSearchParams(location.search);if(['topic','author','all'].includes(params.get('view')))view=params.get('view');document.querySelectorAll('.filter').forEach(b=>b.classList.toggle('active',b.dataset.view===view));if(groups().has(params.get('group')))selected=params.get('group');else if(!groups().has(selected))selected=[...groups().keys()][0];renderPosts();const post=params.get('post');if(post&&known.has('posts/'+post))show('posts/'+post,false);else selectGroup(selected,false)});
addEventListener('load',init);
</script></body></html>
