<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101828"><meta name="description" content="오늘AI — 함께 배우는 AI 인사이트">
<title>오늘AI · AI 학습 아카이브</title>
<style>
:root{color-scheme:light;--ink:#182334;--muted:#64748b;--line:#e4e9f0;--blue:#2958d6;--bg:#f5f7fb}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.75 system-ui,-apple-system,"Noto Sans KR",sans-serif}button,a{touch-action:manipulation}a{color:var(--blue)}header{background:#101828;color:#fff;padding:20px max(20px,calc((100vw - 1060px)/2));display:flex;justify-content:space-between;align-items:center;gap:10px}header strong{letter-spacing:.14em;font-size:20px}header span{color:#aab9d0;font-size:12px}header a{color:#d7e5ff;text-decoration:none;font-size:13px}.shell{max-width:1100px;margin:auto;padding:24px 16px;display:grid;grid-template-columns:280px minmax(0,1fr);gap:20px}.panel,.article{background:white;border:1px solid var(--line);border-radius:16px;box-shadow:0 6px 25px #15244108}.panel{padding:20px;align-self:start;position:sticky;top:15px;max-height:calc(100vh - 30px);overflow:auto}.panel h2{font-size:14px;letter-spacing:.05em;margin:0 0 14px}.filters{display:flex;gap:5px;margin-bottom:12px;flex-wrap:wrap}.filter{border:1px solid var(--line);border-radius:20px;padding:6px 10px;background:white;cursor:pointer;font-size:12px;color:var(--ink)}.filter.active{background:#1f4dd1;color:white;border-color:#1f4dd1}.group-title{font-size:12px;color:var(--muted);font-weight:700;margin:16px 8px 6px}.item{display:block;text-align:left;width:100%;border:1px solid transparent;background:none;padding:12px;border-radius:10px;cursor:pointer;color:var(--ink);font:inherit;line-height:1.4}.item small{display:block;color:var(--muted);margin-top:4px}.item:hover,.item.active{background:#edf3ff;border-color:#dce6ff}.article{padding:clamp(22px,5vw,52px);min-height:65vh}.eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--blue)}.article h1{font-size:clamp(26px,4vw,38px);line-height:1.35;margin:10px 0 20px;letter-spacing:-.03em}.article h2{font-size:24px;line-height:1.4;border-top:1px solid var(--line);padding-top:30px;margin-top:36px}.article h3{font-size:19px;margin-top:26px}.article p,.article li{overflow-wrap:anywhere}.article blockquote{border-left:4px solid #b6c9f5;background:#f7faff;margin:18px 0;padding:6px 20px}.article pre{overflow:auto;background:#152134;color:white;padding:16px;border-radius:10px}.article code{font-size:.88em}.article table{border-collapse:collapse;display:block;overflow-x:auto;font-size:14px}.article th,.article td{padding:10px 12px;border:1px solid var(--line);text-align:left}.article img{max-width:100%}.toc{padding:14px 18px;border-radius:12px;background:#f5f8ff;border:1px solid #e2eaff;margin:20px 0}.toc strong{display:block;margin-bottom:7px}.toc a{display:block;font-size:14px;padding:4px 0;text-decoration:none}.meta{color:var(--muted);font-size:13px}.tools{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0 22px}.tools a,.tools button{border:1px solid var(--line);border-radius:9px;padding:8px 13px;background:#fff;color:#334155;text-decoration:none;cursor:pointer;font-size:13px}.top{position:fixed;right:20px;bottom:24px;border:0;background:#1f4dd1;color:#fff;border-radius:99px;padding:13px 17px;box-shadow:0 5px 20px #1f4dd144;cursor:pointer;font-weight:700;z-index:10}.top[hidden]{display:none}.status{color:var(--muted)}@media(max-width:760px){header{padding:16px 18px}.shell{display:block;padding:12px}.panel{position:static;max-height:none;margin-bottom:12px;padding:14px}.panel nav{display:flex;overflow-x:auto;gap:8px}.item{min-width:190px;max-width:230px;border-color:var(--line);font-size:14px}.article{padding:24px 18px}.article h2{font-size:21px}.top{right:14px;bottom:16px}}
</style>
<script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js" defer></script>
</head><body id="top"><header><div><strong>오늘AI</strong><div><span>오늘의 AI를 이해하는 학습 아카이브</span></div></div><a href="https://github.com/20220330jin/ai_signal" target="_blank" rel="noopener noreferrer">GitHub ↗</a></header>
<main class="shell"><aside class="panel"><h2>글 찾아보기</h2><div class="filters" id="filters"><button type="button" class="filter active" data-view="topic">주제별</button><button type="button" class="filter" data-view="author">작성자별</button><button type="button" class="filter" data-view="all">전체</button></div><nav id="posts"><span class="status">목록을 불러오는 중…</span></nav><p class="meta">GitHub Markdown 원본을 불러옵니다. 새 글이 색인에 추가되면 목록도 갱신됩니다.</p></aside><section class="article"><div class="eyebrow" id="eyebrow">오늘AI · 학습 아카이브</div><div class="tools"><a id="source" href="https://github.com/20220330jin/ai_signal" target="_blank" rel="noopener noreferrer">GitHub 원본 ↗</a><button id="copy" type="button">현재 글 링크 복사</button></div><div id="toc" class="toc" hidden></div><div id="content" class="status" aria-live="polite">분석을 불러오는 중…</div></section></main><button class="top" id="topButton" type="button" hidden aria-label="페이지 맨 위로 이동">↑ 맨 위로</button>
<script>
const base='https://raw.githubusercontent.com/20220330jin/ai_signal/main/';
const postsEl=document.getElementById('posts'),content=document.getElementById('content'),toc=document.getElementById('toc');
const known=new Map();let active='';let view='topic';
const displayTitles={'SIGNAL-001':'AI 초지능 시대의 안전과 통제','SIGNAL-002':'사람마다 AI의 능력을 다르게 평가하는 이유','SIGNAL-003':'LLM Wiki — AI가 관리하는 개인 지식 저장소'};
function displayTitle(id,topic){return displayTitles[id]||topic||id}
const categories={'SIGNAL-001':['AI 안전·보안'],'SIGNAL-002':['AI 모델·성능','AI 에이전트'],'SIGNAL-003':['AI 에이전트','지식 관리']};
function getCategories(id,topic){return categories[id]||[topic?.split('·')[0].trim()||'기타']}
function renderPosts(){postsEl.textContent='';const entries=[...known.entries()].map(([path,data])=>({path,...data,id:path.split('/')[1].replace('.md','')}));const groups=new Map();for(const e of entries){const keys=view==='author'?[e.author.replace(/\s*\(@.*$/,'').trim()]:view==='topic'?getCategories(e.id,e.topic):['모든 글'];for(const k of keys){if(!groups.has(k))groups.set(k,[]);groups.get(k).push(e)}}for(const [group,items] of groups){const h=document.createElement('div');h.className='group-title';h.textContent=group+' · '+items.length+'편';postsEl.append(h);for(const e of items){const b=document.createElement('button');b.type='button';b.className='item'+(active===e.path?' active':'');b.dataset.path=e.path;const title=document.createElement('strong');title.textContent=displayTitle(e.id,e.topic);const meta=document.createElement('small');meta.textContent=view==='author'?getCategories(e.id,e.topic).join(' · '):e.author;b.append(title,meta);b.addEventListener('click',()=>show(e.path));postsEl.append(b)}}}
const safePath=p=>/^posts\/SIGNAL-\d{3,}\.md$/.test(p);
function escapeHTML(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function get(path){const r=await fetch(base+path+'?v='+Math.floor(Date.now()/300000));if(!r.ok)throw Error('GitHub 원본 요청 실패: '+r.status);return r.text()}
function rewriteLinks(){content.querySelectorAll('a[href]').forEach(a=>{const href=a.getAttribute('href');if(!href||href.startsWith('#'))return;if(/^(https?:)?\/\//.test(href)){a.target='_blank';a.rel='noopener noreferrer';return}const path=href.replace(/^\.\.\//,'');if(safePath(path)){a.href='?post='+encodeURIComponent(path.split('/')[1]);return}a.href='https://github.com/20220330jin/ai_signal/blob/main/'+path;a.target='_blank';a.rel='noopener noreferrer'})}
function makeToc(){const hs=[...content.querySelectorAll('h2,h3')];toc.innerHTML='';if(!hs.length){toc.hidden=true;return}const title=document.createElement('strong');title.textContent='이 글의 목차';toc.append(title);hs.forEach((h,i)=>{h.id='section-'+i;const a=document.createElement('a');a.href='#'+h.id;a.textContent=(h.tagName==='H3'?'　':'')+h.textContent;toc.append(a)});toc.hidden=false}
async function show(path,history=true){if(!safePath(path))return;active=path;content.textContent='본문을 불러오는 중…';toc.hidden=true;try{const md=await get(path);if(!window.marked||!window.DOMPurify)throw Error('Markdown 표시 도구를 불러오지 못했습니다');const html=marked.parse(md,{gfm:true,breaks:false});content.innerHTML=DOMPurify.sanitize(html);rewriteLinks();makeToc();const id=path.split('/')[1].replace('.md','');document.getElementById('eyebrow').textContent='AI 인사이트 · '+id;const heading=content.querySelector('h1');if(heading)heading.textContent=displayTitle(id,known.get(path)?.topic);document.getElementById('source').href='https://github.com/20220330jin/ai_signal/blob/main/'+path;document.title=displayTitle(id,known.get(path)?.topic)+' · 오늘AI';postsEl.querySelectorAll('button.item').forEach(b=>b.classList.toggle('active',b.dataset.path===path));if(history)window.history.pushState({path},'', '?post='+encodeURIComponent(path.split('/')[1]));window.scrollTo({top:0,behavior:'smooth'})}catch(e){content.textContent='문서를 표시할 수 없습니다. 잠시 후 다시 시도하거나 GitHub 원본을 열어주세요. ('+e.message+')'}}
async function init(){try{const index=await get('INDEX.md');const lines=index.split('\n').filter(x=>x.includes('](posts/SIGNAL-'));for(const line of lines){const m=line.match(/\[([^\]]+)\]\((posts\/SIGNAL-\d{3,}\.md)\)\s*\|\s*([^|]+)\|\s*([^|]+)/);if(!m)continue;known.set(m[2],{topic:m[4].trim(),author:m[3].trim()})}renderPosts();if(!known.size)throw Error('등록된 게시물이 없습니다');const query=new URLSearchParams(location.search).get('post');const requested=query&&safePath('posts/'+query)?'posts/'+query:null;await show(requested&&known.has(requested)?requested:[...known.keys()].at(-1),false)}catch(e){postsEl.textContent='목록을 불러오지 못했습니다.';content.textContent=e.message}}
document.getElementById('filters').addEventListener('click',e=>{const btn=e.target.closest('button[data-view]');if(!btn)return;view=btn.dataset.view;document.querySelectorAll('.filter').forEach(b=>b.classList.toggle('active',b===btn));renderPosts()});
document.getElementById('copy').addEventListener('click',async()=>{const url=location.href;try{await navigator.clipboard.writeText(url);document.getElementById('copy').textContent='복사 완료 ✓'}catch{prompt('링크 복사',url)}});
const topBtn=document.getElementById('topButton');topBtn.addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));addEventListener('scroll',()=>topBtn.hidden=scrollY<350,{passive:true});addEventListener('popstate',e=>{const query=new URLSearchParams(location.search).get('post');if(query&&known.has('posts/'+query))show('posts/'+query,false)});
addEventListener('load',init);
</script></body></html>
